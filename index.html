        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;900&family=Syncopate:wght@700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .font-inter { font-family: 'Inter', sans-serif; }
        
        /* Animación de desplazamiento infinito para la preview de GitHub */
        @keyframes github-scroll {
          0% { transform: translateY(0); }
          100% { transform: translateY(-50%); }
        }
        .animate-github-scroll {
          animation: github-scroll 12s linear infinite;
        }
        
        /* Reproducción de estilo "Yurei" despedazado */
        .yurei-shattered-container {
          position: relative;
          display: inline-block;
          font-family: 'Syncopate', sans-serif; /* Fuente ancha y cibernética */
          font-weight: 700;
          color: #f8fafc;
          line-height: 1.2;
          text-transform: lowercase;
          letter-spacing: -2px;
        }
        .yurei-shattered-base {
          opacity: 0; /* Ocultamos el texto base para mostrar los pedazos */
        }
        .yurei-slice {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          transition: transform 0.3s ease;
        }
        
        /* Cortes diagonales para efecto "despedazado" con colores neón */
        .slice-1 { 
          clip-path: polygon(0 0, 100% 0, 100% 25%, 0 35%); 
          transform: translate(-3px, -2px) rotate(-1deg); 
          color: #38bdf8; /* Azul claro */
          text-shadow: 2px 0px 5px rgba(56, 189, 248, 0.5);
        }
        .slice-2 { 
          clip-path: polygon(0 35%, 100% 25%, 100% 55%, 0 45%); 
          transform: translate(4px, 1px); 
          color: #f8fafc; /* Blanco */
        }
        .slice-3 { 
          clip-path: polygon(0 45%, 100% 55%, 100% 85%, 0 75%); 
          transform: translate(-2px, 3px) rotate(0.5deg); 
          color: #818cf8; /* Índigo */
          text-shadow: -2px 0px 5px rgba(129, 140, 248, 0.5);
        }
        .slice-4 { 
          clip-path: polygon(0 75%, 100% 85%, 100% 100%, 0 100%); 
          transform: translate(3px, -2px); 
          color: #f8fafc; /* Blanco */
        }

        /* Animación sutil de los pedazos flotando al pasar el mouse */
        .yurei-shattered-container:hover .slice-1 { transform: translate(-5px, -4px) rotate(-2deg); }
        .yurei-shattered-container:hover .slice-2 { transform: translate(6px, 2px); }
        .yurei-shattered-container:hover .slice-3 { transform: translate(-4px, 5px) rotate(1deg); }
        .yurei-shattered-container:hover .slice-4 { transform: translate(5px, -3px); }
    </style>
</head>
